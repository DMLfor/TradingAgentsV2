[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tdx_data"
version = "0.1.0"
description = "通信达行情数据读取与查询包（MySQL/SQLite）"
requires-python = ">=3.9"
dependencies = [
    "pymysql>=1.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
reader = ["mootdx>=0.11.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["tdx_data*"]
