[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdx_core"
version = "0.1.0"
description = "通信达行情数据读取与查询包（MySQL/SQLite）"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pymysql>=1.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "numpy>=1.24",
    "tqdm>=4.60",
]

[project.optional-dependencies]
reader = ["mootdx>=0.11.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
tdx = "tdx_core.cli:cli"

[tool.setuptools.packages.find]
include = ["tdx_core*"]
